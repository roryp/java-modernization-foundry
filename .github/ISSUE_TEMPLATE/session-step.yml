name: Session step
description: Add a step to the live session roadmap.
title: "N.M · "
body:
  - type: markdown
    attributes:
      value: |
        Steps are numbered `act.step` (for example `3.2`). Add the issue to its act milestone and as a sub-issue of the session roadmap.
  - type: dropdown
    id: act
    attributes:
      label: Act
      options:
        - Act 0 · Prep the stage
        - Act 1 · Cloud-native on Azure Container Apps
        - Act 2 · GitHub-powered delivery
        - Act 3 · AI-enabled with Microsoft Foundry
        - Act 4 · Observe, optimize, and scale
        - Act 5 · Showtime
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - "🎬 on-stage: shown live"
        - "🧰 prep: built before the session"
        - "⭐ stretch: only if time allows"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The story beat. Which part of the session abstract does this step prove?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: on-stage
    attributes:
      label: On stage
      description: What the audience sees, and roughly how many minutes it takes.
  - type: textarea
    id: references
    attributes:
      label: References
